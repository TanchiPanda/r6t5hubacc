<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R6T5 Hub · 登录回调</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei","PingFang SC",-apple-system,sans-serif; }
  body {
    min-height:100vh; background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
    color:#fff; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card { width:100%; max-width:420px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:28px; text-align:center; }
  .h { font-size:18px; color:#ffd700; margin-bottom:12px; }
  .msg { font-size:14px; color:#a8a8d8; line-height:1.8; }
  .err { color:#ff8888; }
  .btn { display:inline-block; margin-top:18px; padding:11px 28px; border-radius:10px;
    background:linear-gradient(135deg,#ffd700,#ff8822); color:#1a1a2e; font-weight:bold;
    text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <div class="h" id="title">正在完成登录…</div>
  <div class="msg" id="msg">请稍候，正在交换授权码。</div>
</div>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var code = Q.get("code") || "";
  var state = Q.get("state") || "";
  var error = Q.get("error") || Q.get("error_description") || "";

  var CB_REDIRECT_URI = "https://myacc.r6t5.dpdns.org/callback";
  // 同源 Pages Function 代理（secret 不下发前端）
  var CB_TOKEN_PROXY = "/api/cb-token";
  var CB_USERINFO_PROXY = "/api/cb-userinfo";

  function show(msg, isErr, title) {
    document.getElementById("msg").textContent = msg;
    document.getElementById("msg").className = "msg" + (isErr ? " err" : "");
    if (title) document.getElementById("title").textContent = title;
  }
  function backHome() { location.replace("/"); }

  // 安全跳转：仅允许 r6t5.dpdns.org 子域
  function safeRedirect(url) {
    try {
      var ru = new URL(url, location.origin);
      if (ru.protocol === "https:" && ru.hostname.endsWith(".r6t5.dpdns.org")) {
        location.replace(ru.href);
        return true;
      }
    } catch (e) {}
    return false;
  }

  function saveUser(u) {
    try { localStorage.setItem("wordGameGitHubUser", JSON.stringify(u)); } catch (e) {}
    try {
      var d = new Date();
      d.setTime(d.getTime() + 7 * 864e5);
      document.cookie = "ms_user=" + encodeURIComponent(JSON.stringify(u)) +
        ";expires=" + d.toUTCString() + ";path=/;domain=.r6t5.dpdns.org;SameSite=Lax;Secure";
    } catch (e) {}
  }
  function saveTokens(at, rt, expiresIn) {
    try {
      localStorage.setItem("r6t5CbAccessToken", at || "");
      if (rt) localStorage.setItem("r6t5CbRefreshToken", rt);
      var exp = Date.now() + (Number(expiresIn) || 3600) * 1000 - 60000;
      localStorage.setItem("r6t5CbAccessExp", String(exp));
    } catch (e) {}
  }

  if (error) {
    show("授权被拒绝或失败：" + error, true, "登录失败");
    return;
  }
  if (!code) { backHome(); return; }

  // state 校验（与发起授权时存在 sessionStorage 的值比对）
  var savedState = "";
  try { savedState = sessionStorage.getItem("r6t5CbState") || ""; } catch (e) {}
  if (savedState && state && savedState !== state) {
    show("授权状态校验失败，请重新登录。", true, "登录失败");
    return;
  }

  var verifier = "";
  try { verifier = sessionStorage.getItem("r6t5CbCodeVerifier") || ""; } catch (e) {}

  (async function () {
    try {
      var r = await fetch(CB_TOKEN_PROXY, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code: code,
          code_verifier: verifier,
          redirect_uri: CB_REDIRECT_URI
        })
      });
      var d = await r.json().catch(function () { return {}; });
      var data = d.data || d;
      if (!r.ok || !data.access_token) {
        throw new Error(d.msg || data.msg || d.error_description || ("换 token 失败 HTTP " + r.status));
      }
      saveTokens(data.access_token, data.refresh_token, data.expires_in);

      // 取用户信息
      var info = {};
      var ui = await fetch(CB_USERINFO_PROXY, { headers: { Authorization: "Bearer " + data.access_token } });
      if (ui.ok) info = await ui.json().catch(function () { return {}; }) || {};
      var email = info.email || info.preferred_username || "";
      var user = {
        id: info.sub || email,
        name: info.name || info.nickname || email,
        email: email,
        login: email,
        avatar_url: info.picture || info.avatar_url || ""
      };
      saveUser(user);

      // 清理临时状态
      try {
        sessionStorage.removeItem("r6t5CbCodeVerifier");
        sessionStorage.removeItem("r6t5CbState");
      } catch (e) {}

      // 跳回来源应用；否则回首页
      var returnTo = "";
      try { returnTo = localStorage.getItem("msReturnTo") || ""; localStorage.removeItem("msReturnTo"); } catch (e) {}
      if (returnTo && safeRedirect(returnTo)) return;
      backHome();
    } catch (e) {
      show("登录失败：" + ((e && e.message) || e), true, "登录失败");
    }
  })();
})();
</script>
</body>
</html>
