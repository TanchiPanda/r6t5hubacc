<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R6T5 Hub · 账号管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei","PingFang SC",-apple-system,sans-serif; }
  body {
    min-height:100vh;
    background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
    color:#fff;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px;
  }
  .container { width:100%; max-width:480px; }
  .header { text-align:center; margin-bottom:28px; }
  .header h1 { font-size:24px; color:#ffd700; letter-spacing:2px; }
  .header p { font-size:13px; color:#a8a8d8; margin-top:6px; }
  .card {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px; padding:24px; margin-bottom:16px;
    backdrop-filter:blur(10px);
  }
  .card h2 { font-size:16px; color:#ffd700; margin-bottom:16px; }
  /* tab 切换 */
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab {
    flex:1; padding:11px 0; text-align:center; border-radius:10px; cursor:pointer;
    font-size:15px; font-weight:bold; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12); color:#a8a8d8; transition:0.15s;
  }
  .tab.active {
    background:linear-gradient(135deg,#ffd700,#ff8822); color:#1a1a2e; border-color:transparent;
  }
  input {
    width:100%; padding:12px; border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08); color:#fff; font-size:14px;
    margin-top:8px; box-sizing:border-box;
  }
  input::placeholder { color:#8888bb; }
  .avatar {
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(135deg,#4a9e6e,#5ab87e);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; margin:0 auto 12px;
  }
  .email { text-align:center; font-size:14px; color:#a8a8d8; margin-bottom:4px; word-break:break-all; }
  .nickname { text-align:center; font-size:18px; font-weight:bold; margin-bottom:16px; }
  .btn {
    width:100%; padding:12px; border-radius:10px; border:none;
    font-size:15px; font-weight:bold; cursor:pointer; margin-top:8px;
    transition:0.15s;
  }
  .btn:active { transform:scale(0.98); }
  .btn-primary { background:linear-gradient(135deg,#ffd700,#ff8822); color:#1a1a2e; }
  .btn-secondary { background:rgba(78,205,196,0.15); color:#4ecdc4; border:1px solid rgba(78,205,196,0.4); }
  .btn-danger { background:rgba(255,100,100,0.15); color:#ff6b6b; border:1px solid rgba(255,107,107,0.4); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .msg.ok { color:#39d98a; }
  .msg.err { color:#ff8888; }
  .hidden { display:none !important; }
  .note { font-size:13px; color:#a8a8d8; line-height:1.7; }
  .links { text-align:center; margin-top:12px; font-size:13px; }
  .links a { color:#4ecdc4; cursor:pointer; text-decoration:underline; }
  .turnstile-wrap { margin:14px 0 2px; display:flex; justify-content:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="pageTitle">⚡ R6T5 Hub</h1>
    <p id="pageSubtitle">账号管理中心</p>
  </div>

  <!-- 未登录 -->
  <div id="loginPage" class="hidden">
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
      <div class="tab" id="tabReg" onclick="switchTab('reg')">注册</div>
    </div>

    <!-- 登录表单 -->
    <div class="card" id="loginFormCard">
      <h2>登录</h2>
      <div class="note" id="loginHint" style="margin-bottom:8px;">使用邮箱登录，一个账号通行全部应用。</div>
      <input type="email" id="loginEmail" placeholder="邮箱地址" autocomplete="username">
      <input type="password" id="loginPw" placeholder="密码" autocomplete="current-password">
      <div class="turnstile-wrap">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFNdFDGD5uPcjBhh" data-callback="onTurnLogin"></div>
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()" disabled>登录</button>
      <button class="btn btn-secondary" id="passkeyLoginBtn" onclick="loginWithPasskey()">🔑 使用通行密钥登录</button>
      <div class="links"><a onclick="sendMagicLink()">发送魔法链接（免密码登录）</a></div>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- 注册表单 -->
    <div class="card hidden" id="regFormCard">
      <h2>注册</h2>
      <div class="note" style="margin-bottom:8px;">创建新账号，一个账号通行全部应用。</div>
      <input type="email" id="regEmail" placeholder="邮箱地址" autocomplete="username">
      <input type="password" id="regPw" placeholder="设置密码（至少 6 位）" autocomplete="new-password">
      <input type="password" id="regPw2" placeholder="确认密码" autocomplete="new-password">
      <div class="turnstile-wrap">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFNdFDGD5uPcjBhh" data-callback="onTurnReg"></div>
      </div>
      <button class="btn btn-primary" id="regBtn" onclick="doRegister()" disabled>注册</button>
      <div class="msg" id="regMsg"></div>
    </div>
  </div>

  <!-- 已登录 -->
  <div id="adminPage" class="hidden">
    <div class="card">
      <div class="avatar">👤</div>
      <div class="email" id="adminEmail"></div>
      <div class="nickname" id="adminNick"></div>
    </div>

    <div class="card">
      <h2>🧩 我的应用</h2>
      <button class="btn btn-secondary" onclick="openApp('wordgm')">⚡ 单词闯关</button>
      <button class="btn btn-secondary" onclick="openApp('wallet')">💰 积分钱包</button>
      <button class="btn btn-secondary" onclick="openApp('wrobook')">📕 错题本</button>
      <button class="btn btn-secondary" onclick="openApp('tanchi')">📝 TanchiNotes</button>
    </div>

    <div class="card">
      <h2>🔑 通行密钥（Passkey）</h2>
      <div class="note" style="margin-bottom:10px;">用设备生物识别 / PIN / 安全钥匙免密登录，防钓鱼。需先在 Supabase 后台 Authentication → Passkeys 开启。</div>
      <div id="passkeyList" style="margin-bottom:10px;"></div>
      <button class="btn btn-secondary" id="addPasskeyBtn" onclick="addPasskey()">创建通行密钥</button>
      <div class="msg" id="passkeyMsg"></div>
    </div>

    <button class="btn btn-danger" onclick="doLogout()">退出登录</button>
    <div class="msg" id="adminMsg"></div>
  </div>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="sbauth.js?v=20261030"></script>
<script>
const Q = new URLSearchParams(location.search);
const APP = Q.get("app") || "";
const RETURN_URL = Q.get("return") || "";
const APP_NAMES = { wordgm: "《单词闯关》", wallet: "积分钱包", wrobook: "《错题本》", tanchi: "《TanchiNotes》" };
const APP_URLS = {
  wordgm: "https://wordgm.r6t5.dpdns.org",
  wallet: "https://wallet.r6t5.dpdns.org",
  wrobook: "https://wrobook.r6t5.dpdns.org",
  tanchi: "https://tanchi.r6t5.dpdns.org"
};

let turnLoginToken = null;
let turnRegToken = null;
function onTurnLogin(token) { turnLoginToken = token; document.getElementById("loginBtn").disabled = false; }
function onTurnReg(token) { turnRegToken = token; document.getElementById("regBtn").disabled = false; }

if (APP && APP_NAMES[APP]) {
  document.getElementById("pageTitle").textContent = "🔐 登录";
  document.getElementById("pageSubtitle").textContent = "登录以继续使用" + APP_NAMES[APP];
  document.getElementById("loginHint").textContent =
    "登录以继续使用" + APP_NAMES[APP] + "，一个账号通行全部应用。";
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = "msg " + (ok ? "msg ok" : "msg err");
}

// ---------- tab 切换 ----------
function switchTab(which) {
  var isLogin = which === "login";
  document.getElementById("tabLogin").classList.toggle("active", isLogin);
  document.getElementById("tabReg").classList.toggle("active", !isLogin);
  document.getElementById("loginFormCard").classList.toggle("hidden", !isLogin);
  document.getElementById("regFormCard").classList.toggle("hidden", isLogin);
}

function showLogin() {
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("adminPage").classList.add("hidden");
}

function showAdmin(user) {
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("adminPage").classList.remove("hidden");
  document.getElementById("adminEmail").textContent = user.email || "";
  document.getElementById("adminNick").textContent = user.name || user.email || "用户";
  loadPasskeys();
}

// ---------- 通行密钥（Passkey / WebAuthn）----------
function escHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

async function loadPasskeys() {
  var box = document.getElementById("passkeyList");
  if (!box) return;
  try {
    var client = await sbInit();
    if (!client.auth.passkey || typeof client.auth.passkey.list !== "function") {
      box.innerHTML = '<div class="note">当前客户端版本不支持通行密钥，请升级 supabase-js。</div>';
      return;
    }
    var { data, error } = await client.auth.passkey.list();
    if (error) { box.innerHTML = ""; return; }
    if (!data || !data.length) {
      box.innerHTML = '<div class="note">尚未创建通行密钥。</div>';
      return;
    }
    box.innerHTML = data.map(function (p) {
      var name = p.friendly_name || "通行密钥";
      var t = p.last_used_at
        ? "上次使用 " + new Date(p.last_used_at).toLocaleDateString("zh-CN")
        : "已创建 " + new Date(p.created_at).toLocaleDateString("zh-CN");
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.1);">'
        + '<div><div style="font-size:14px;font-weight:bold;">' + escHtml(name) + '</div>'
        + '<div style="font-size:12px;color:#a8a8d8;">' + escHtml(t) + '</div></div>'
        + '<button class="btn btn-danger" style="width:auto;margin-top:0;padding:6px 12px;font-size:13px;" onclick="delPasskey(\'' + p.id + '\')">删除</button>'
        + '</div>';
    }).join("");
  } catch (e) {
    box.innerHTML = "";
  }
}

async function addPasskey() {
  var btn = document.getElementById("addPasskeyBtn");
  try {
    var client = await sbInit();
    if (typeof client.auth.registerPasskey !== "function") {
      showMsg("passkeyMsg", "当前客户端版本不支持通行密钥", false); return;
    }
    btn.disabled = true; btn.textContent = "正在创建…";
    var { data, error } = await client.auth.registerPasskey();
    if (error) throw error;
    showMsg("passkeyMsg", "通行密钥创建成功！", true);
    loadPasskeys();
  } catch (e) {
    showMsg("passkeyMsg", (e && e.message) || "创建失败（可能已取消，或后台未开启 Passkey）", false);
  }
  btn.disabled = false; btn.textContent = "创建通行密钥";
}

async function delPasskey(pid) {
  if (!confirm("确定删除该通行密钥？")) return;
  try {
    var client = await sbInit();
    var { error } = await client.auth.passkey.delete({ passkeyId: pid });
    if (error) throw error;
    showMsg("passkeyMsg", "已删除", true);
    loadPasskeys();
  } catch (e) {
    showMsg("passkeyMsg", (e && e.message) || "删除失败", false);
  }
}

async function loginWithPasskey() {
  try {
    var client = await sbInit();
    if (typeof client.auth.signInWithPasskey !== "function") {
      showMsg("loginMsg", "当前版本不支持通行密钥", false); return;
    }
    var { data, error } = await client.auth.signInWithPasskey();
    if (error) throw error;
    var u = await sbRefreshUser();
    afterLogin(u);
  } catch (e) {
    showMsg("loginMsg", (e && e.message) || "通行密钥登录失败", false);
  }
}

// ---------- 登录 ----------
async function doLogin() {
  var email = document.getElementById("loginEmail").value.trim();
  var pw = document.getElementById("loginPw").value;
  var btn = document.getElementById("loginBtn");
  if (!email || !email.includes("@")) { showMsg("loginMsg", "请输入有效邮箱", false); return; }
  if (!pw) { showMsg("loginMsg", "请输入密码", false); return; }
  if (!turnLoginToken) { showMsg("loginMsg", "请先完成安全验证", false); return; }
  btn.disabled = true; btn.textContent = "登录中…";
  try {
    var client = await sbInit();
    var { data, error } = await client.auth.signInWithPassword({ email: email, password: pw });
    if (error) throw error;
    var u = await sbRefreshUser();
    afterLogin(u);
  } catch (e) {
    showMsg("loginMsg", (e && e.message) || "登录失败，邮箱或密码错误", false);
    btn.disabled = false; btn.textContent = "登录";
  }
}

// ---------- 注册 ----------
async function doRegister() {
  var email = document.getElementById("regEmail").value.trim();
  var pw = document.getElementById("regPw").value;
  var pw2 = document.getElementById("regPw2").value;
  var btn = document.getElementById("regBtn");
  if (!email || !email.includes("@")) { showMsg("regMsg", "请输入有效邮箱", false); return; }
  if (pw.length < 6) { showMsg("regMsg", "密码至少 6 位", false); return; }
  if (pw !== pw2) { showMsg("regMsg", "两次输入的密码不一致", false); return; }
  if (!turnRegToken) { showMsg("regMsg", "请先完成安全验证", false); return; }
  btn.disabled = true; btn.textContent = "注册中…";
  try {
    var client = await sbInit();
    var redirectTo = location.origin + "/?app=" + (APP || "");
    var { data, error } = await client.auth.signUp({
      email: email,
      password: pw,
      options: { emailRedirectTo: redirectTo }
    });
    if (error) throw error;
    // 开启邮箱确认时 data.session 为空，需用户点邮件链接验证
    if (!data.session) {
      showMsg("regMsg", "注册成功！请检查收件箱（含垃圾邮件），点击验证邮件完成后再登录。", true);
      document.getElementById("regPw").value = "";
      document.getElementById("regPw2").value = "";
      btn.disabled = false; btn.textContent = "注册";
      return;
    }
    // 未开启邮箱确认：直接进入
    var u = await sbRefreshUser();
    afterLogin(u);
  } catch (e) {
    var msg = (e && e.message) || "注册失败";
    if (msg.indexOf("already") >= 0 || msg.indexOf("registered") >= 0) {
      msg = "该邮箱已注册，请直接登录";
      switchTab("login");
    }
    showMsg("regMsg", msg, false);
    btn.disabled = false; btn.textContent = "注册";
  }
}

async function sendMagicLink() {
  var email = document.getElementById("loginEmail").value.trim();
  if (!email || !email.includes("@")) { showMsg("loginMsg", "请先输入邮箱", false); return; }
  try {
    var client = await sbInit();
    await client.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: location.origin + "/?app=" + (APP || "") }
    });
    showMsg("loginMsg", "已发送登录链接到邮箱，请查收", true);
  } catch (e) {
    showMsg("loginMsg", (e && e.message) || "发送失败", false);
  }
}

function afterLogin(u) {
  // 优先跳回原页面（return 参数需是同站或已注册的应用域名，防止开放重定向）
  if (RETURN_URL) {
    try {
      var ru = new URL(RETURN_URL, location.origin);
      if (ru.protocol === "https:" && ru.hostname.endsWith(".r6t5.dpdns.org")) {
        location.href = ru.href; return;
      }
    } catch (e) {}
  }
  if (APP && APP_URLS[APP]) { location.href = APP_URLS[APP]; return; }
  showAdmin(u);
}

function openApp(id) {
  if (APP_URLS[id]) location.href = APP_URLS[id];
}

async function doLogout() {
  await msLogout();
}

(async function () {
  try {
    // 先处理回调（魔法链接 / 邮箱验证回跳）
    var result = await msHandleRedirect();
    if (result) { afterLogin(result); return; }
    var user = sbGetUser();
    if (user) { afterLogin(user); }
    else { showLogin(); }
  } catch (e) {
    showLogin();
  }
})();
</script>
</body>
</html>
