<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R6T5 Hub · 账号管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei","PingFang SC",-apple-system,sans-serif; }
  body {
    min-height:100vh;
    background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
    color:#fff;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px;
  }
  .container { width:100%; max-width:480px; }
  .header { text-align:center; margin-bottom:28px; }
  .header h1 { font-size:24px; color:#ffd700; letter-spacing:2px; }
  .header p { font-size:13px; color:#a8a8d8; margin-top:6px; }
  .card {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px; padding:24px; margin-bottom:16px;
    backdrop-filter:blur(10px);
  }
  .card h2 { font-size:16px; color:#ffd700; margin-bottom:16px; }
  input {
    width:100%; padding:12px; border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08); color:#fff; font-size:14px;
    margin-top:8px; box-sizing:border-box;
  }
  input::placeholder { color:#8888bb; }
  .avatar {
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(135deg,#4a9e6e,#5ab87e);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; margin:0 auto 12px;
  }
  .email { text-align:center; font-size:14px; color:#a8a8d8; margin-bottom:4px; word-break:break-all; }
  .nickname { text-align:center; font-size:18px; font-weight:bold; margin-bottom:16px; }
  .btn {
    width:100%; padding:12px; border-radius:10px; border:none;
    font-size:15px; font-weight:bold; cursor:pointer; margin-top:8px;
    transition:0.15s;
  }
  .btn:active { transform:scale(0.98); }
  .btn-primary { background:linear-gradient(135deg,#ffd700,#ff8822); color:#1a1a2e; }
  .btn-secondary { background:rgba(78,205,196,0.15); color:#4ecdc4; border:1px solid rgba(78,205,196,0.4); }
  .btn-danger { background:rgba(255,100,100,0.15); color:#ff6b6b; border:1px solid rgba(255,107,107,0.4); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .msg.ok { color:#39d98a; }
  .msg.err { color:#ff8888; }
  .hidden { display:none !important; }
  .note { font-size:13px; color:#a8a8d8; line-height:1.7; }
  .links { text-align:center; margin-top:12px; font-size:13px; }
  .links a { color:#4ecdc4; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="pageTitle">⚡ R6T5 Hub</h1>
    <p id="pageSubtitle">账号管理中心</p>
  </div>

  <div id="loginPage" class="hidden">
    <div class="card">
      <h2 id="loginTitle">登录</h2>
      <div class="note" id="loginHint" style="margin-bottom:16px;">
        使用 R6T5 网盘账号授权登录，一个账号通行全部应用。
        账号在 <b style="color:#ffd700;">netdisk.r6t5.dpdns.org</b> 统一管理，无需单独注册。
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="cbLogin()">使用 R6T5 账号登录</button>
      <div class="links"><a href="reg.html">还没有账号？了解如何注册</a></div>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div id="adminPage" class="hidden">
    <div class="card">
      <div class="avatar">👤</div>
      <div class="email" id="adminEmail"></div>
      <div class="nickname" id="adminNick"></div>
    </div>

    <div class="card">
      <h2>🧩 我的应用</h2>
      <button class="btn btn-secondary" onclick="openApp('wordgm')">⚡ 单词闯关</button>
      <button class="btn btn-secondary" onclick="openApp('wallet')">💰 积分钱包</button>
      <button class="btn btn-secondary" onclick="openApp('wrobook')">📕 错题本</button>
      <button class="btn btn-secondary" onclick="openApp('tanchi')">📝 TanchiNotes</button>
      <button class="btn btn-secondary" onclick="openApp('open-platform')">🧩 R6T5 开放平台</button>
      <button class="btn btn-secondary" onclick="location.href='egree.html'">📊 额度状态</button>
      <button class="btn btn-secondary" onclick="location.href='license.html'">🔑 授权管理</button>
    </div>

    <button class="btn btn-danger" onclick="doLogout()">退出登录</button>
    <div class="msg" id="adminMsg"></div>
  </div>
</div>

<script src="sbauth.js?v=20261121"></script>
<script>
const Q = new URLSearchParams(location.search);
const APP = Q.get("app") || "";
const RETURN_URL = Q.get("return") || "";
const APP_NAMES = { wordgm: "《单词闯关》", wallet: "积分钱包", wrobook: "《错题本》", tanchi: "《TanchiNotes》", "open-platform": "R6T5 开放平台" };
const APP_URLS = {
  wordgm: "https://wordgm.r6t5.dpdns.org",
  wallet: "https://wallet.r6t5.dpdns.org",
  wrobook: "https://wrobook.r6t5.dpdns.org",
  tanchi: "https://tanchi.r6t5.dpdns.org",
  "open-platform": "https://partner.r6t5.dpdns.org"
};
// 没带 return 时，登录完成回到应用自己的站点
const APP_RETURNS = { "open-platform": "https://partner.r6t5.dpdns.org" };

if (APP && APP_NAMES[APP]) {
  document.getElementById("pageTitle").textContent = "🔐 登录";
  document.getElementById("pageSubtitle").textContent = "登录以继续使用" + APP_NAMES[APP];
  document.getElementById("loginHint").textContent =
    "登录以继续使用" + APP_NAMES[APP] + "，使用 R6T5 网盘账号授权即可。";
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = "msg " + (ok ? "msg ok" : "msg err");
}

function showLogin() {
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("adminPage").classList.add("hidden");
}

function showAdmin(user) {
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("adminPage").classList.remove("hidden");
  document.getElementById("adminEmail").textContent = user.email || "";
  document.getElementById("adminNick").textContent = user.name || user.email || "用户";
}

function cbLogin() {
  var returnTo = RETURN_URL || (APP && APP_RETURNS[APP]) || "";
  msLogin({ returnTo: returnTo || undefined });
}

async function afterLogin(u) {
  const BACK_URL = RETURN_URL || (APP_RETURNS[APP] || "");
  if (BACK_URL) {
    try {
      var ru = new URL(BACK_URL, location.origin);
      if (ru.protocol === "https:" && ru.hostname.endsWith(".r6t5.dpdns.org")) {
        location.href = ru.href;
        return;
      }
    } catch (e) {}
  }
  if (APP && APP_URLS[APP]) { location.href = APP_URLS[APP]; return; }
  showAdmin(u);
}

function openApp(id) {
  if (APP_URLS[id]) { location.href = APP_URLS[id]; return; }
  var tip = document.getElementById("adminMsg");
  if (tip) tip.textContent = "「" + (APP_NAMES[id] || id) + "」站点还没接入，app 标识已登记为 " + id;
}

async function doLogout() {
  await msLogout();
}

(async function () {
  try {
    var result = await msHandleRedirect();
    if (result) { afterLogin(result); return; }
  } catch (e) {}
  showLogin();
})();
</script>
<script src="sidebar.js?v=20261113"></script>
</body>
</html>
