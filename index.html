<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R6T5 Hub · 账号管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft Yahei","PingFang SC",-apple-system,sans-serif; }
  body {
    min-height:100vh;
    background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
    color:#fff;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px;
  }
  .container { width:100%; max-width:480px; }
  .header { text-align:center; margin-bottom:28px; }
  .header h1 { font-size:24px; color:#ffd700; letter-spacing:2px; }
  .header p { font-size:13px; color:#a8a8d8; margin-top:6px; }
  .card {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px; padding:24px; margin-bottom:16px;
    backdrop-filter:blur(10px);
  }
  .card h2 { font-size:16px; color:#ffd700; margin-bottom:16px; }
  .avatar {
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(135deg,#f25022,#ffb900);
    display:flex; align-items:center; justify-content:center;
    font-size:28px; margin:0 auto 12px;
  }
  .email { text-align:center; font-size:14px; color:#a8a8d8; margin-bottom:4px; word-break:break-all; }
  .nickname { text-align:center; font-size:18px; font-weight:bold; margin-bottom:16px; }
  .btn {
    width:100%; padding:12px; border-radius:10px; border:none;
    font-size:15px; font-weight:bold; cursor:pointer; margin-top:8px;
    transition:0.15s;
  }
  .btn:active { transform:scale(0.98); }
  .btn-primary { background:linear-gradient(135deg,#ffd700,#ff8822); color:#1a1a2e; }
  .btn-secondary { background:rgba(78,205,196,0.15); color:#4ecdc4; border:1px solid rgba(78,205,196,0.4); }
  .btn-danger { background:rgba(255,100,100,0.15); color:#ff6b6b; border:1px solid rgba(255,107,107,0.4); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .msg.ok { color:#39d98a; }
  .msg.err { color:#ff8888; }
  .hidden { display:none !important; }
  .bar { height:8px; border-radius:4px; background:rgba(255,255,255,0.12); overflow:hidden; margin:6px 0; }
  .bar > div { height:100%; background:linear-gradient(90deg,#0f6cbd,#4ecdc4); }
  .kv { display:flex; justify-content:space-between; font-size:13px; color:#a8a8d8; }
  .note { font-size:13px; color:#a8a8d8; line-height:1.7; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="pageTitle">⚡ R6T5 Hub</h1>
    <p id="pageSubtitle">账号管理中心</p>
  </div>

  <!-- 未登录 -->
  <div id="loginPage" class="hidden">
    <div class="card">
      <h2>登录</h2>
      <div class="note" id="loginHint" style="margin-bottom:14px;">使用 Microsoft 账号登录，一个账号通行全部应用。</div>
      <button class="btn btn-primary" id="msLoginBtn" onclick="startLogin()">使用 Microsoft 账号登录</button>
      <div class="note" style="margin-top:12px;font-size:12px;color:#888;">
        没有 Microsoft 账号？
        <a href="https://signup.live.com/" target="_blank" style="color:#4ecdc4;text-decoration:none;">免费注册一个</a>
      </div>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- 已登录 -->
  <div id="adminPage" class="hidden">
    <div class="card">
      <div class="avatar">👤</div>
      <div class="email" id="adminEmail"></div>
      <div class="nickname" id="adminNick"></div>
      <button class="btn btn-secondary" onclick="window.open('https://account.microsoft.com/','_blank')">管理 Microsoft 账号</button>
    </div>

    <div class="card">
      <h2>☁️ OneDrive 云空间</h2>
      <div id="driveBox"><div class="note">正在读取…</div></div>
    </div>

    <div class="card">
      <h2>🧩 我的应用</h2>
      <button class="btn btn-secondary" onclick="openApp('wordgm')">⚡ 单词闯关</button>
      <button class="btn btn-secondary" onclick="openApp('wrobook')">📕 错题本</button>
      <button class="btn btn-secondary" onclick="openApp('tanchi')">📝 TanchiNotes</button>
    </div>

    <button class="btn btn-danger" onclick="doLogout()">退出登录</button>
    <div class="msg" id="adminMsg"></div>
  </div>
</div>

<script src="msauth.js?v=20261016"></script>
<script>
const Q = new URLSearchParams(location.search);
const APP = Q.get("app") || "";
const APP_NAMES = { wordgm: "《单词闯关》", wrobook: "《错题本》", tanchi: "《TanchiNotes》" };
const APP_URLS = {
  wordgm: "https://wordgm.r6t5.dpdns.org",
  wrobook: "https://wrobook.r6t5.dpdns.org",
  tanchi: "https://tanchi.r6t5.dpdns.org"
};
const REDIRECT_URI = location.origin + "/";

if (APP && APP_NAMES[APP]) {
  document.getElementById("pageTitle").textContent = "🔐 登录";
  document.getElementById("pageSubtitle").textContent = "登录以继续使用" + APP_NAMES[APP];
  document.getElementById("loginHint").textContent =
    "登录以继续使用" + APP_NAMES[APP] + "，使用 Microsoft 账号，同时可开启 OneDrive 云同步。";
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
}

function showLogin() {
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("adminPage").classList.add("hidden");
}

function showAdmin(user) {
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("adminPage").classList.remove("hidden");
  document.getElementById("adminEmail").textContent = user.email || "";
  document.getElementById("adminNick").textContent = user.name || user.email || "用户";
  renderDrive();
}

async function startLogin() {
  const b = document.getElementById("msLoginBtn");
  b.disabled = true; b.textContent = "正在跳转…";
  await msLogin({ redirectUri: REDIRECT_URI, prompt: "select_account" });
}

async function renderDrive() {
  const box = document.getElementById("driveBox");
  if (!msPeekToken()) {
    box.innerHTML = '<div class="note">尚未授权 OneDrive。点击下方按钮授权后即可查看空间用量。</div>' +
      '<button class="btn btn-secondary" onclick="authorizeDrive()">🔑 授权 OneDrive</button>';
    return;
  }
  box.innerHTML = '<div class="note">正在读取…</div>';
  try {
    const q = await msGetDriveQuota();
    const gb = n => (n / 1073741824).toFixed(2) + " GB";
    const pct = q.total ? Math.round(q.used / q.total * 100) : 0;
    box.innerHTML =
      '<div class="kv"><span>已用 ' + gb(q.used) + '</span><span>共 ' + gb(q.total) + '</span></div>' +
      '<div class="bar"><div style="width:' + pct + '%"></div></div>' +
      '<div class="note" style="margin-top:4px;">剩余 ' + gb(q.remaining) + '（' + pct + '% 已用）</div>' +
      '<button class="btn btn-secondary" onclick="renderDrive()">🔄 刷新</button>' +
      '<button class="btn btn-secondary" onclick="window.open(\'https://go.microsoft.com/fwlink/?linkid=2248426\',\'_blank\')">➕ 扩容</button>';
  } catch (e) {
    box.innerHTML = '<div class="note" style="color:#ff8888;">读取失败：' + (e.message || e) + '</div>' +
      '<button class="btn btn-secondary" onclick="authorizeDrive()">🔑 重新授权</button>';
  }
}

async function authorizeDrive() {
  const t = await msGetToken({ force: true });
  if (t) { showMsg("adminMsg", "✅ 已授权", true); renderDrive(); }
  else { showMsg("adminMsg", "⚠️ 授权未完成，请重试", false); }
}

function openApp(id) {
  if (APP_URLS[id]) location.href = APP_URLS[id];
}

async function doLogout() {
  await msLogout(REDIRECT_URI);
}

(async function () {
  try {
    const result = await msHandleRedirect(REDIRECT_URI);
    if (result) {
      if (APP && APP_URLS[APP]) { location.href = APP_URLS[APP]; return; }
      showAdmin(result);
      return;
    }
    const user = msGetUser();
    if (user) {
      if (APP && APP_URLS[APP]) { location.href = APP_URLS[APP]; return; }
      showAdmin(user);
    } else {
      showLogin();
    }
  } catch (e) {
    showLogin();
    showMsg("loginMsg", "初始化失败：" + (e.message || e), false);
  }
})();
</script>
</body>
</html>
